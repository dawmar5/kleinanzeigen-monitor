name: Monitor okazji Kleinanzeigen

on:
  schedule:
    - cron: '*/30 * * * *'   # co 30 minut
  workflow_dispatch: {}       # pozwala tez uruchomic recznie z zakladki Actions

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: kleinanzeigen-monitor
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Uruchom skaner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Zapisz liste widzianych ogloszen
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "aktualizacja widzianych ogloszen"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Proba $i nieudana, czekam i probuje ponownie..."
            sleep 5
          done
