name: Monitor okazji Kleinanzeigen

on:
  schedule:
    - cron: '*/30 * * * *'   # co 30 minut
  workflow_dispatch: {}       # pozwala tez uruchomic recznie z zakladki Actions

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: kleinanzeigen-monitor
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Uruchom skaner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scraper.py

      - name: Zapisz liste widzianych ogloszen
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add seen_ids.json
          if git diff --staged --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "aktualizacja widzianych ogloszen"
          git fetch origin main
          git merge -X ours --no-edit origin/main || true
          git push || echo "Nie udalo sie zapisac listy - nie krytyczne, program dziala dalej normalnie."
